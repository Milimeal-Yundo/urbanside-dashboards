<style>
  :root { --surface: #fcfcfb; --plane: #f9f9f7; --ink: #0b0b0b; --muted: #898781; --border: rgba(11,11,11,0.10); --accent: #2a78d6; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --plane: #0d0d0d; --ink: #ffffff; --muted: #898781; --border: rgba(255,255,255,0.10); --accent: #3987e5; }
  }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--plane); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 36px; width: 380px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  a { display: block; padding: 12px 14px; margin-top: 10px; border: 1px solid var(--border); border-radius: 10px;
      color: var(--accent); font-size: 14px; font-weight: 600; text-decoration: none; }
  a:hover { background: rgba(128,128,128,0.06); }
</style>
</head>
