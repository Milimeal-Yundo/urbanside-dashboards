<title>어반사이드 비판매 물량 배정·사용 현황</title>
<style>
  :root { --surface: #fcfcfb; --plane: #f9f9f7; --ink: #0b0b0b; --muted: #898781; --border: rgba(11,11,11,0.10); --accent: #2a78d6; --danger: #d03b3b; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --plane: #0d0d0d; --ink: #ffffff; --muted: #898781; --border: rgba(255,255,255,0.10); --accent: #3987e5; --danger: #e66767; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--plane); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px 36px; width: 340px; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  p { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
  input { width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px; border: 1px solid var(--border);
          background: var(--plane); color: var(--ink); }
  button { width: 100%; margin-top: 12px; padding: 10px; font-size: 14px; font-weight: 600; border: none;
           border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .err { color: var(--danger); font-size: 12px; margin-top: 10px; display: none; }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(password) {
  const keyMaterial = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
  return new TextDecoder().decode(plain);
}

async function unlock() {
  const pw = document.getElementById("pw").value;
  const btn = document.getElementById("btn");
  btn.disabled = true; btn.textContent = "확인 중...";
  try {
    const html = await decrypt(pw);
    sessionStorage.setItem("dashpw", pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById("err").style.display = "block";
    btn.disabled = false; btn.textContent = "열기";
  }
}

document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });

(async () => {
  const saved = sessionStorage.getItem("dashpw");
  if (saved) {
    try { const html = await decrypt(saved); document.open(); document.write(html); document.close(); }
    catch (e) { sessionStorage.removeItem("dashpw"); }
  }
})();
</script>
